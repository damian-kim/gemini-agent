services:
  agent-os:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: agent-os
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - /data/agent-os:/data/agent-os
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
